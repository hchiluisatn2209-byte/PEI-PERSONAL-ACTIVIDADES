<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="🥇 PLANPEI — Planificación y Logística Telconet">
  <title>🥇 PLANPEI — Telconet</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230F1923'/><polyline points='22,12 18,12 15,21 9,3 6,12 2,12' fill='none' stroke='%2300A8E8' stroke-width='2.5'/></svg>">
  <style>
/* ============================================================
   🥇 PLANPEI — Planificación y Logística — Telconet
   Design System / Main CSS
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

/* ── Tokens ─────────────────────────────────────────────── */
:root {
  /* Surface */
  --bg-app:       #0F1923;
  --bg-sidebar:   #0F1923;
  --bg-panel:     #1A2B3C;
  --bg-content:   #F0F4F8;
  --bg-card:      #FFFFFF;
  --bg-row-alt:   #F7FAFC;

  /* Brand */
  --accent:       #00A8E8;
  --accent-dark:  #0086BB;
  --accent-light: #E6F7FF;

  /* Estado-color */
  --state-op:     #10B981;  /* Operativo */
  --state-op-bg:  #ECFDF5;
  --state-mat:    #F59E0B;  /* Maternidad/Lactancia */
  --state-mat-bg: #FFFBEB;
  --state-vac:    #8B5CF6;  /* Vacaciones */
  --state-vac-bg: #F5F3FF;
  --state-det:    #EF4444;  /* Detenida */
  --state-det-bg: #FEF2F2;
  --state-rep:    #F97316;  /* Replanificada */
  --state-rep-bg: #FFF7ED;
  --state-med:    #06B6D4;  /* Permiso médico */
  --state-med-bg: #ECFEFF;

  /* Ciudad-color (badges) */
  --city-uio:     #2563EB;
  --city-gye:     #DC2626;
  --city-mil:     #7C3AED;
  --city-other:   #475569;

  /* Texto */
  --text-primary:   #0F172A;
  --text-secondary: #475569;
  --text-muted:     #94A3B8;
  --text-inverse:   #F8FAFC;
  --text-accent:    #00A8E8;

  /* Bordes */
  --border:       #E2E8F0;
  --border-dark:  #CBD5E1;

  /* Tipografía */
  --font-ui:   'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;

  /* Escala */
  --text-xs:   0.6875rem; /* 11px */
  --text-sm:   0.75rem;   /* 12px */
  --text-base: 0.875rem;  /* 14px */
  --text-md:   1rem;      /* 16px */
  --text-lg:   1.125rem;  /* 18px */
  --text-xl:   1.375rem;  /* 22px */

  /* Espaciado */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* Sidebar */
  --sidebar-w: 220px;
  --header-h:  56px;

  /* Radios */
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-full: 9999px;

  /* Sombras */
  --shadow-sm:  0 1px 3px rgba(0,0,0,.08);
  --shadow-md:  0 4px 12px rgba(0,0,0,.10);
  --shadow-lg:  0 8px 24px rgba(0,0,0,.14);
  --shadow-card:0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.08);

  /* Transiciones */
  --ease: cubic-bezier(.4,0,.2,1);
  --t-fast: 120ms;
  --t-base: 200ms;
}

/* ── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-ui);
  font-size: var(--text-base);
  color: var(--text-primary);
  background: var(--bg-content);
  line-height: 1.5;
  overflow-x: hidden;
}
button { cursor: pointer; font-family: inherit; border: none; background: none; }
input, select, textarea {
  font-family: inherit;
  font-size: var(--text-base);
  outline: none;
  border: none;
}
a { color: inherit; text-decoration: none; }
img, svg { display: block; }
ul { list-style: none; }

/* ── Layout shell ───────────────────────────────────────── */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--header-h) 1fr;
  grid-template-areas:
    "sidebar header"
    "sidebar main";
  min-height: 100vh;
}

/* ── Fix sidebar fijo: header y main respetan el ancho ── */
.app-header {
  margin-left: var(--sidebar-w);
  width: calc(100% - var(--sidebar-w));
  box-sizing: border-box;
}
.app-main {
  margin-left: var(--sidebar-w);
  width: calc(100% - var(--sidebar-w));
  box-sizing: border-box;
  min-width: 0;
}

/* ── Sidebar ────────────────────────────────────────────── */
.sidebar {
  grid-area: sidebar;
  background: var(--bg-sidebar);
  color: var(--text-inverse);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  width: var(--sidebar-w);
  height: 100vh;
  z-index: 100;
  overflow-y: auto;
}

.sidebar-logo {
  padding: var(--sp-5) var(--sp-4);
  border-bottom: 1px solid rgba(255,255,255,.08);
  flex-shrink: 0;
}
.sidebar-logo-mark {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.logo-icon {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-icon svg { width: 18px; height: 18px; }
.logo-text { line-height: 1.2; }
.logo-product {
  font-size: var(--text-sm);
  font-weight: 700;
  letter-spacing: .04em;
  color: #fff;
  text-transform: uppercase;
}
.logo-company {
  font-size: var(--text-xs);
  color: rgba(255,255,255,.45);
  font-weight: 400;
}

/* Nav */
.sidebar-nav {
  flex: 1;
  padding: var(--sp-3) 0;
  overflow-y: auto;
}
.nav-section {
  margin-bottom: var(--sp-2);
}
.nav-section-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
  padding: var(--sp-3) var(--sp-4) var(--sp-1);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 9px var(--sp-4);
  font-size: var(--text-sm);
  font-weight: 500;
  color: rgba(255,255,255,.6);
  border-radius: 0;
  transition: color var(--t-fast) var(--ease),
              background var(--t-fast) var(--ease);
  position: relative;
  cursor: pointer;
}
.nav-item:hover {
  color: #fff;
  background: rgba(255,255,255,.06);
}
.nav-item.active {
  color: #fff;
  background: rgba(0,168,232,.15);
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 20px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}
.nav-icon {
  width: 16px; height: 16px;
  opacity: .7;
  flex-shrink: 0;
}
.nav-item.active .nav-icon,
.nav-item:hover .nav-icon { opacity: 1; }
.nav-badge {
  margin-left: auto;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: var(--r-full);
  min-width: 18px;
  text-align: center;
}

/* Sidebar footer */
.sidebar-footer {
  padding: var(--sp-4);
  border-top: 1px solid rgba(255,255,255,.08);
  flex-shrink: 0;
}
.user-card {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.user-avatar {
  width: 32px; height: 32px;
  border-radius: var(--r-full);
  background: var(--accent);
  color: #fff;
  font-size: var(--text-xs);
  font-weight: 700;
  font-family: var(--font-mono);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.user-info { flex: 1; min-width: 0; }
.user-name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.user-role {
  font-size: var(--text-xs);
  color: rgba(255,255,255,.4);
}

/* ── Header ─────────────────────────────────────────────── */
.app-header {
  grid-area: header;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: 0 var(--sp-6);
  position: sticky;
  top: 0;
  z-index: 50;
  /* Fix: header no queda tapado por sidebar */
  min-width: 0;
  overflow: hidden;
}
.header-title {
  font-size: var(--text-md);
  font-weight: 700;
  color: var(--text-primary);
  flex: 1;
}
.header-subtitle {
  font-size: var(--text-sm);
  font-weight: 400;
  color: var(--text-muted);
  margin-left: var(--sp-2);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}

/* ── Main content ────────────────────────────────────────── */
.app-main {
  grid-area: main;
  padding: var(--sp-6);
  overflow-y: auto;
  min-width: 0;
}

/* ── Buttons ────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 7px var(--sp-4);
  border-radius: var(--r-md);
  font-size: var(--text-sm);
  font-weight: 600;
  transition: all var(--t-fast) var(--ease);
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-dark); }
.btn-secondary {
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--bg-row-alt); border-color: var(--border-dark); }
.btn-ghost {
  color: var(--text-secondary);
  padding: 7px var(--sp-3);
}
.btn-ghost:hover { background: var(--bg-row-alt); color: var(--text-primary); }
.btn-sm {
  padding: 4px var(--sp-3);
  font-size: var(--text-xs);
  font-weight: 600;
}
.btn-icon {
  width: 32px; height: 32px;
  padding: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-md);
}
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }

/* ── Badges / Tags ──────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-size: var(--text-xs);
  font-weight: 600;
  white-space: nowrap;
}
.badge-op      { background: var(--state-op-bg);  color: var(--state-op); }
.badge-mat     { background: var(--state-mat-bg); color: var(--state-mat); }
.badge-vac     { background: var(--state-vac-bg); color: var(--state-vac); }
.badge-det     { background: var(--state-det-bg); color: var(--state-det); }
.badge-rep     { background: var(--state-rep-bg); color: var(--state-rep); }
.badge-med     { background: var(--state-med-bg); color: var(--state-med); }
.badge-neutral { background: var(--border);       color: var(--text-secondary); }

/* Iniciales badge (firma del sistema) */
.initials-badge {
  width: 32px; height: 32px;
  border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  flex-shrink: 0;
  cursor: default;
  transition: transform var(--t-fast) var(--ease),
              box-shadow var(--t-fast) var(--ease);
}
.initials-badge:hover {
  transform: scale(1.12);
  box-shadow: 0 0 0 3px rgba(255,255,255,.4);
}
.initials-badge.city-uio   { background: var(--city-uio); }
.initials-badge.city-gye   { background: var(--city-gye); }
.initials-badge.city-mil   { background: var(--city-mil); }
.initials-badge.city-other { background: var(--city-other); }
.initials-badge.sz-lg {
  width: 40px; height: 40px;
  font-size: 13px;
}

/* ── Cards ──────────────────────────────────────────────── */
.card {
  background: var(--bg-card);
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
}
.card-header {
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.card-title {
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--text-primary);
  flex: 1;
}
.card-body { padding: var(--sp-5); }

/* ── KPI Cards ──────────────────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
}
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-4) var(--sp-5);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  box-shadow: var(--shadow-card);
  transition: box-shadow var(--t-base) var(--ease),
              transform var(--t-base) var(--ease);
}
.kpi-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.kpi-label {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .05em;
}
.kpi-value {
  font-size: 28px;
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--text-primary);
  line-height: 1;
}
.kpi-sub {
  font-size: var(--text-xs);
  color: var(--text-muted);
}
.kpi-icon {
  width: 28px; height: 28px;
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: var(--sp-1);
}
.kpi-icon svg { width: 15px; height: 15px; }
.kpi-icon.accent  { background: var(--accent-light);    color: var(--accent); }
.kpi-icon.green   { background: var(--state-op-bg);     color: var(--state-op); }
.kpi-icon.yellow  { background: var(--state-mat-bg);    color: var(--state-mat); }
.kpi-icon.red     { background: var(--state-det-bg);    color: var(--state-det); }
.kpi-icon.purple  { background: var(--state-vac-bg);    color: var(--state-vac); }

/* ── Semana Selector ────────────────────────────────────── */
.week-nav {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: var(--sp-2) var(--sp-3);
  box-shadow: var(--shadow-sm);
}
.week-nav-label {
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--text-primary);
  white-space: nowrap;
  min-width: 200px;
  text-align: center;
}
.week-nav-sub {
  font-size: var(--text-xs);
  color: var(--text-muted);
  text-align: center;
}
.week-btn {
  width: 30px; height: 30px;
  border-radius: var(--r-full);
  background: var(--bg-row-alt);
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--t-fast) var(--ease);
  flex-shrink: 0;
}
.week-btn:hover { background: var(--accent); color: #fff; }
.week-btn svg { width: 14px; height: 14px; }

/* ── Tabla de Distribución Semanal ──────────────────────── */
.dist-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.dist-toolbar {
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  flex-wrap: wrap;
}
.dist-toolbar-title {
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--text-primary);
  flex: 1;
}

/* Filtros inline */
.filter-group {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.filter-select {
  padding: 5px var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--text-primary);
  background: var(--bg-card);
  cursor: pointer;
  transition: border-color var(--t-fast);
}
.filter-select:hover { border-color: var(--accent); }
.filter-select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }

/* Scroll container */
.dist-scroll {
  overflow-x: auto;
  overflow-y: auto;
  max-height: calc(100vh - 320px);
}

/* Tabla */
.dist-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-sm);
  min-width: 900px;
}

/* Headers */
.dist-table thead {
  position: sticky;
  top: 0;
  z-index: 20;
}
.dist-table th {
  background: var(--bg-app);
  color: rgba(255,255,255,.75);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: var(--sp-3) var(--sp-3);
  text-align: left;
  white-space: nowrap;
  border-right: 1px solid rgba(255,255,255,.08);
}
.dist-table th:last-child { border-right: none; }
.dist-table th.col-sticky {
  position: sticky;
  left: 0;
  z-index: 25;
  background: var(--bg-app);
}

/* Rows */
.dist-table tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background var(--t-fast) var(--ease);
}
.dist-table tbody tr:hover { background: var(--accent-light); }
.dist-table tbody tr:last-child { border-bottom: none; }

/* Separador de grupo (PROYECTOS CRM / OTS MASIVAS / TERCERIZADOS) */
.dist-table tbody tr.group-header td {
  background: var(--bg-panel);
  color: var(--text-inverse);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 6px var(--sp-3);
  position: sticky;
  left: 0;
  z-index: 10;
}
.dist-table tbody tr.group-header td .group-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: var(--r-full);
  margin-right: var(--sp-2);
  vertical-align: middle;
}

/* Celdas */
.dist-table td {
  padding: 10px var(--sp-3);
  vertical-align: middle;
  border-right: 1px solid var(--border);
  white-space: nowrap;
}
.dist-table td:last-child { border-right: none; }

/* Columna sticky: nombre planificador */
.col-planificador {
  position: sticky;
  left: 0;
  background: var(--bg-card);
  z-index: 10;
  min-width: 200px;
  max-width: 200px;
  white-space: nowrap;
}
.dist-table tbody tr:hover .col-planificador { background: var(--accent-light); }

.planner-cell {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.planner-info { flex: 1; min-width: 0; }
.planner-name {
  font-weight: 600;
  font-size: var(--text-sm);
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.planner-cargo {
  font-size: var(--text-xs);
  color: var(--text-muted);
}

/* Columna TS */
.ts-cell {
  min-width: 180px;
  max-width: 220px;
}
.ts-value {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--accent-dark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
  display: block;
}
.ts-empty {
  font-size: var(--text-xs);
  color: var(--text-muted);
  font-style: italic;
}

/* Columna clientes */
.clientes-cell {
  min-width: 200px;
  max-width: 260px;
}
.cliente-tags {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.cliente-tag {
  font-size: var(--text-xs);
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 240px;
}

/* Columna backup */
.backup-cell {
  min-width: 90px;
}
.backup-pair {
  display: flex;
  gap: var(--sp-1);
  align-items: center;
}
.backup-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: var(--r-sm);
  background: var(--bg-row-alt);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

/* Columna disponibilidad */
.dispon-cell { min-width: 100px; }

/* Columna observaciones */
.obs-cell {
  min-width: 160px;
  max-width: 200px;
}
.obs-text {
  font-size: var(--text-xs);
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
  display: block;
  cursor: pointer;
}
.obs-text:hover { color: var(--accent); }

/* Columnas checkbox de tareas */
.task-cell {
  min-width: 36px;
  max-width: 44px;
  text-align: center;
  padding: 8px var(--sp-2);
}
.task-check {
  width: 18px; height: 18px;
  border-radius: var(--r-sm);
  border: 1.5px solid var(--border-dark);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto;
  transition: all var(--t-fast) var(--ease);
  cursor: pointer;
  flex-shrink: 0;
}
.task-check.checked {
  background: var(--state-op);
  border-color: var(--state-op);
}
.task-check.checked svg {
  display: block;
  width: 11px; height: 11px;
  color: #fff;
}
.task-check:not(.checked) svg { display: none; }
.task-check:hover { border-color: var(--accent); }

/* Celdas de indisponibilidad (row highlight) */
.dist-table tbody tr.row-maternidad td { background: #FFFBEB; }
.dist-table tbody tr.row-maternidad:hover td { background: #FEF9C3; }
.dist-table tbody tr.row-vacaciones td { background: #F5F3FF; }
.dist-table tbody tr.row-vacaciones:hover td { background: #EDE9FE; }
.dist-table tbody tr.row-medico td { background: #ECFEFF; }
.dist-table tbody tr.row-maternidad .col-planificador,
.dist-table tbody tr.row-vacaciones .col-planificador,
.dist-table tbody tr.row-medico .col-planificador {
  background: inherit;
}

/* ── Módulo Personal ─────────────────────────────────────── */
.personal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--sp-4);
}
.personal-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-5);
  box-shadow: var(--shadow-card);
  transition: box-shadow var(--t-base) var(--ease), transform var(--t-base) var(--ease);
  cursor: pointer;
}
.personal-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.personal-card-header {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}
.personal-card-info { flex: 1; min-width: 0; }
.personal-name {
  font-weight: 700;
  font-size: var(--text-sm);
  color: var(--text-primary);
  line-height: 1.3;
}
.personal-cargo {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-top: 2px;
}
.personal-card-details {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.personal-detail {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--text-xs);
  color: var(--text-secondary);
}
.personal-detail svg { width: 12px; height: 12px; flex-shrink: 0; opacity: .6; }
.personal-card-footer {
  margin-top: var(--sp-4);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ── Turnos Calendar ─────────────────────────────────────── */
.turno-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.turno-row {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-3) var(--sp-4);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  transition: box-shadow var(--t-fast);
}
.turno-row:hover { box-shadow: var(--shadow-sm); }
.turno-fecha {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--text-secondary);
  min-width: 110px;
}
.turno-planificador {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex: 1;
}
.turno-nombre {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text-primary);
}
.turno-tipo { margin-left: auto; }

/* ── Modales ────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,25,35,.6);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-4);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-base) var(--ease);
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.modal {
  background: var(--bg-card);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  transform: translateY(16px) scale(.98);
  transition: transform var(--t-base) var(--ease);
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-header {
  padding: var(--sp-5) var(--sp-6);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.modal-title {
  font-size: var(--text-md);
  font-weight: 700;
  flex: 1;
}
.modal-body { padding: var(--sp-6); }
.modal-footer {
  padding: var(--sp-4) var(--sp-6);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--sp-3);
}

/* Formularios en modal */
.form-group { margin-bottom: var(--sp-4); }
.form-label {
  display: block;
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: var(--sp-2);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.form-input,
.form-select,
.form-textarea {
  width: 100%;
  padding: 9px var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: var(--text-sm);
  color: var(--text-primary);
  background: var(--bg-card);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-4);
}

/* ── Tabs ───────────────────────────────────────────────── */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border);
  margin-bottom: var(--sp-5);
}
.tab {
  padding: var(--sp-3) var(--sp-5);
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  cursor: pointer;
  transition: all var(--t-fast) var(--ease);
  white-space: nowrap;
}
.tab:hover { color: var(--text-primary); }
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ── Empty states ───────────────────────────────────────── */
.empty {
  padding: var(--sp-8) var(--sp-4);
  text-align: center;
}
.empty-icon {
  width: 48px; height: 48px;
  margin: 0 auto var(--sp-4);
  opacity: .25;
}
.empty-title {
  font-size: var(--text-md);
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: var(--sp-2);
}
.empty-desc {
  font-size: var(--text-sm);
  color: var(--text-muted);
}

/* ── Toast notifications ─────────────────────────────────── */
.toast-container {
  position: fixed;
  bottom: var(--sp-6);
  right: var(--sp-6);
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  pointer-events: none;
}
.toast {
  background: var(--text-primary);
  color: #fff;
  padding: var(--sp-3) var(--sp-5);
  border-radius: var(--r-lg);
  font-size: var(--text-sm);
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  pointer-events: all;
  animation: toastIn var(--t-base) var(--ease) forwards;
  max-width: 360px;
}
.toast.success { background: var(--state-op); }
.toast.error   { background: var(--state-det); }
.toast.warning { background: var(--state-mat); color: var(--text-primary); }
.toast svg { width: 16px; height: 16px; flex-shrink: 0; }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(24px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ── Tooltip ────────────────────────────────────────────── */
[data-tooltip] {
  position: relative;
  cursor: default;
}
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--text-primary);
  color: #fff;
  font-size: var(--text-xs);
  font-weight: 500;
  padding: 4px 10px;
  border-radius: var(--r-sm);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--t-fast);
  z-index: 100;
}
[data-tooltip]:hover::after { opacity: 1; }

/* ── Scrollbar ──────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ── Search ─────────────────────────────────────────────── */
.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.search-icon {
  position: absolute;
  left: 10px;
  width: 14px; height: 14px;
  color: var(--text-muted);
  pointer-events: none;
}
.search-input {
  padding: 7px var(--sp-3) 7px 32px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: var(--text-sm);
  color: var(--text-primary);
  background: var(--bg-card);
  width: 240px;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
  width: 300px;
  transition: width var(--t-base), border-color var(--t-fast), box-shadow var(--t-fast);
}
.search-input::placeholder { color: var(--text-muted); }

/* ── Section headers ─────────────────────────────────────── */
.section-header {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  margin-bottom: var(--sp-5);
}
.section-title {
  font-size: var(--text-xl);
  font-weight: 700;
  color: var(--text-primary);
  flex: 1;
}
.section-desc {
  font-size: var(--text-sm);
  color: var(--text-muted);
  margin-top: 2px;
}

/* ── Login screen ───────────────────────────────────────── */
.login-screen {
  min-height: 100vh;
  display: flex;
  background: var(--bg-app);
}
.login-brand {
  width: 420px;
  flex-shrink: 0;
  background: linear-gradient(160deg, var(--bg-panel) 0%, #0d1f30 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--sp-8);
  border-right: 1px solid rgba(255,255,255,.08);
}
.login-content {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-8);
}
.login-box {
  width: 100%;
  max-width: 400px;
}
.login-title {
  font-size: var(--text-xl);
  font-weight: 700;
  color: #fff;
  margin-bottom: var(--sp-2);
}
.login-sub {
  font-size: var(--text-sm);
  color: rgba(255,255,255,.5);
  margin-bottom: var(--sp-8);
}
.btn-google {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-3);
  padding: 12px var(--sp-5);
  background: #fff;
  color: var(--text-primary);
  border-radius: var(--r-md);
  font-weight: 600;
  font-size: var(--text-sm);
  transition: box-shadow var(--t-fast);
  border: none;
  cursor: pointer;
}
.btn-google:hover { box-shadow: 0 0 0 3px rgba(0,168,232,.3); }
.btn-google svg { width: 20px; height: 20px; }
.login-divider {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin: var(--sp-5) 0;
  color: rgba(255,255,255,.2);
  font-size: var(--text-xs);
}
.login-divider::before,
.login-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,.1);
}
.login-notice {
  font-size: var(--text-xs);
  color: rgba(255,255,255,.35);
  text-align: center;
  margin-top: var(--sp-5);
  line-height: 1.6;
}

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width: 900px) {
  .app-shell {
    grid-template-columns: 1fr;
    grid-template-rows: var(--header-h) 1fr;
    grid-template-areas:
      "header"
      "main";
  }
  .sidebar { display: none; }
  .login-brand { display: none; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .form-row { grid-template-columns: 1fr; }
  .personal-grid { grid-template-columns: 1fr; }
}

.personal-list {

  flex-direction: column;
  gap: 0;
  background: var(--bg-card);

  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);

  padding: 10px var(--sp-5);
  border-bottom: 1px solid var(--border);
  transition: background var(--t-fast);
  cursor: pointer;

  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 10px var(--sp-5);

}
.personal-list-header:hover { background: var(--bg-app); }

  overflow: hidden;
  text-overflow: ellipsis;
}
.personal-list-sub {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-top: 1px;
}
.personal-list-cell {
  font-size: var(--text-xs);
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.view-toggle {
  display: flex;
  background: var(--bg-row-alt);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
}
.view-toggle-btn {
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--t-fast);
  border: none;
  background: none;
}
.view-toggle-btn.active {

  box-shadow: var(--shadow-sm);
}
.view-toggle-btn svg { width: 14px; height: 14px; }

/* ── Utilidades ─────────────────────────────────────────── */
.hidden    { display: none !important; }
.sr-only   { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
.truncate  { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flex      { display: flex; }
.flex-col  { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2    { gap: var(--sp-2); }
.gap-3    { gap: var(--sp-3); }
.gap-4    { gap: var(--sp-4); }
.mt-4     { margin-top: var(--sp-4); }
.mt-6     { margin-top: var(--sp-6); }
.mb-4     { margin-bottom: var(--sp-4); }
.mb-6     { margin-bottom: var(--sp-6); }
.w-full   { width: 100%; }
.text-muted  { color: var(--text-muted); }
.text-sm     { font-size: var(--text-sm); }
.text-xs     { font-size: var(--text-xs); }
.font-bold   { font-weight: 700; }
.font-mono   { font-family: var(--font-mono); }

// Helpers de fecha
function parseFecha(str) {
  return new Date(str + 'T00:00:00');
}
function formatFechaCorta(str) {
  const d = parseFecha(str);
  return d.toLocaleDateString('es-EC', { day:'2-digit', month:'short' });
}
function formatFechaLarga(str) {
  const d = parseFecha(str);
  return d.toLocaleDateString('es-EC', { weekday:'short', day:'2-digit', month:'long' });
}
function esMesActual(fechaStr, mes, anio) {
  const d = parseFecha(fechaStr);
  return d.getMonth() === mes && d.getFullYear() === anio;
}
function esPasado(fechaStr) {
  return parseFecha(fechaStr) < new Date();
}
function esFuturo(fechaStr) {
  const d = parseFecha(fechaStr);
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  return d >= hoy;
}
function diasHasta(fechaStr) {
  const d = parseFecha(fechaStr);
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return Math.ceil((d - hoy) / 86400000);
}

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
               'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

async function cargarTurnosSupabase() {
  try {
    // Query 1: turnos básicos
    const { data: turnos, error } = await supabaseClient
      .schema('rrhh')
      .from('turnos')
      .select('id, fecha_inicio, fecha_fin, confirmado, colaborador_id, ciudad_id')
      .order('fecha_inicio');

    if (error) throw error;
    if (!turnos || turnos.length === 0) return PYL.turnosMock;

    // Query 2: colaboradores
    const { data: colabs } = await supabaseClient
      .schema('rrhh')
      .from('colaboradores')
      .select('id, apellidos, nombres, iniciales');

    // Query 3: ciudades
    const { data: ciudades } = await supabaseClient
      .schema('rrhh')
      .from('ciudades')
      .select('id, codigo, nombre');

    const colabMap  = Object.fromEntries((colabs  ||[]).map(c => [c.id, c]));
    const ciudadMap = Object.fromEntries((ciudades ||[]).map(c => [c.id, c]));

    return turnos.map(t => {
      const c  = colabMap[t.colaborador_id]  || {};
      const ci = ciudadMap[t.ciudad_id]      || {};
      return {
        id:           t.id,
        fecha_inicio: t.fecha_inicio,
        fecha_fin:    t.fecha_fin,
        planificador: ((c.apellidos||'') + ' ' + (c.nombres||'')).trim() || 'Sin asignar',
        iniciales:    c.iniciales || '??',
        ciudad:       ci.codigo   || 'UIO',
        confirmado:   t.confirmado,
        reemplazante: null,
      };
    });
  } catch(err) {
    console.error('Error cargando turnos:', err);
    return PYL.turnosMock;
  }
}

      { label:'Con reemplazo', value:conReemplazo, color:'var(--state-vac)' },
    ].map(k => `<div class="card" style="padding:var(--sp-4);text-align:center;">
      <div style="font-size:28px;font-weight:800;font-family:var(--font-mono);color:${k.color};">${k.value}</div>
      <div style="font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;margin-top:4px;">${k.label}</div>
    </div>`).join('')}
  </div>`;

  // 7. Tabs vista
  const vistaActual = TurnosState.vista || 'lista';
  const tabsHtml = ['lista','calendario','historial'].map(v => `
    <div class="tab ${vistaActual === v ? 'active' : ''}"
         onclick="cambiarVistaTurnos('${v}')">
      ${{ lista:'☰ Lista', calendario:'📅 Calendario', historial:'🕐 Historial' }[v]}
    </div>`).join('');

  // 8. Navegación de mes
  const navMes = `
  <div style="display:flex;align-items:center;gap:var(--sp-3);">
    <button class="week-btn" onclick="cambiarMesTurnos(-1)">${ICONS.chevLeft}</button>
    <div style="font-size:var(--text-md);font-weight:700;min-width:160px;text-align:center;">
      ${MESES[mes]} ${anio}
    </div>
    <button class="week-btn" onclick="cambiarMesTurnos(1)">${ICONS.chevRight}</button>
    <span style="margin-left:auto;font-size:var(--text-xs);color:var(--text-muted);">
      ${delMes.length} turno${delMes.length !== 1 ? 's' : ''} este mes
    </span>
  </div>`;

  // 9. Contenido según vista
  let contenido = '';

  if (vistaActual === 'calendario') {
    // Agrupar todos los turnos futuros por mes
    const mesesMap = {};
    turnos.filter(t => t.fecha_fin >= hoyStr).forEach(t => {
      const k = t.fecha_inicio.substring(0,7);
      if (!mesesMap[k]) mesesMap[k] = [];
      mesesMap[k].push(t);
    });
    contenido = Object.entries(mesesMap).sort().map(([mesK, ts]) => {
      const [y, m] = mesK.split('-');
      const nomMes = new Date(+y, +m-1, 1).toLocaleDateString('es-EC',{month:'long',year:'numeric'});
      return `<div class="card mb-4">
        <div class="card-header">
          <div class="card-title" style="text-transform:capitalize;">${nomMes}</div>
          <span class="badge badge-neutral">${ts.length} turno${ts.length>1?'s':''}</span>
        </div>
        <div class="card-body" style="padding:0;">
          ${ts.map(t => `<div class="turno-row" style="border-bottom:1px solid var(--border);">
            <div class="turno-fecha">${formatFechaCorta(t.fecha_inicio)} — ${formatFechaCorta(t.fecha_fin)}</div>
            <div class="turno-planificador">
              ${initBadge(t.iniciales, t.ciudad)}
              <span class="turno-nombre">${t.planificador}</span>
            </div>
            <div style="margin-left:auto;">
              <span class="badge ${t.confirmado?'badge-op':'badge-mat'}">${t.confirmado?'✓ Confirmado':'⏳ Pendiente'}</span>
            </div>
          </div>`).join('')}
        </div>
      </div>`;
    }).join('') || '<div class="empty"><div class="empty-title">Sin turnos futuros</div></div>';

  } else if (vistaActual === 'historial') {
    const pasados = turnos.filter(t => t.fecha_fin < hoyStr).reverse();
    contenido = `<div class="card"><div class="card-body" style="padding:0;">
      ${pasados.length ? pasados.map((t,i) => `
        <div class="turno-row" style="opacity:.7;border-bottom:1px solid var(--border);">
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);min-width:20px;">${i+1}</div>
          <div class="turno-fecha">${formatFechaCorta(t.fecha_inicio)} — ${formatFechaCorta(t.fecha_fin)}</div>
          <div class="turno-planificador">${initBadge(t.iniciales,t.ciudad)}<span class="turno-nombre">${t.planificador}</span></div>
          ${t.reemplazante ? `<span style="font-size:11px;color:var(--state-mat);">↔ ${t.reemplazante}</span>` : ''}
          <span class="badge badge-neutral" style="margin-left:auto;">Realizado</span>
        </div>`).join('') : '<div class="empty"><div class="empty-title">Sin historial</div></div>'}
    </div></div>`;

  } else {
    // Vista lista — turnos del mes seleccionado
    contenido = `<div class="card"><div class="card-header">${navMes}</div>
    <div class="card-body" style="padding:var(--sp-2) var(--sp-4);">
      ${delMes.length ? delMes.map((t,i) => {
        const esPas = t.fecha_fin < hoyStr;
        const diasR = Math.ceil((new Date(t.fecha_inicio+'T00:00:00') - hoy) / 86400000);
        return `<div class="turno-row" style="${esPas?'opacity:.55;':''}border-left:3px solid ${t.confirmado?'var(--state-op)':'var(--state-mat)'};padding-left:var(--sp-3);">
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);min-width:20px;">${i+1}</div>
          <div class="turno-fecha">
            <div style="font-weight:700;">${formatFechaCorta(t.fecha_inicio)}</div>
            <div style="font-size:10px;color:var(--text-muted);">al ${formatFechaCorta(t.fecha_fin)}</div>
          </div>
          <div class="turno-planificador">
            ${initBadge(t.iniciales, t.ciudad)}
            <div>
              <div class="turno-nombre">${t.planificador}</div>
              ${t.reemplazante ? `<div style="font-size:11px;color:var(--state-vac);">↔ Reemplazo: ${t.reemplazante}</div>` : ''}
            </div>
          </div>
          ${!esPas ? `<div style="font-family:var(--font-mono);font-size:12px;font-weight:700;
            color:${diasR<=7?'var(--state-det)':diasR<=14?'var(--state-mat)':'var(--text-muted)'};
            min-width:60px;text-align:center;">${diasR===0?'¡HOY!':diasR<0?'Pasado':`en ${diasR}d`}</div>` : ''}
          <div style="min-width:110px;">${t.confirmado
            ? '<span class="badge badge-op">✓ Confirmado</span>'
            : '<span class="badge badge-mat">⏳ Pendiente</span>'}</div>
          <div style="display:flex;gap:var(--sp-2);">
            <button class="btn btn-ghost btn-sm btn-icon" onclick="abrirModalTurno('${t.id}')" title="Gestionar">✎</button>
            ${!esPas && !t.confirmado ? `<button class="btn btn-sm" style="background:var(--state-op);color:#fff;padding:4px 10px;font-size:11px;" onclick="confirmarTurno('${t.id}')">Confirmar</button>` : ''}
          </div>
        </div>`;
      }).join('') : `<div class="empty" style="padding:var(--sp-6);">
        <div class="empty-title">Sin turnos en ${MESES[mes]}</div>
        <div class="empty-desc">Usa "Asignar turno" para agregar uno</div>
      </div>`}
    </div></div>`;
  }

  // 10. Renderizar todo
  main.innerHTML = `
  <div class="section-header">
    <div>
      <div class="section-title">Turnos de Fin de Semana</div>
      <div class="section-desc">Rotación automática del equipo · ${totalAnio} turnos programados
        <span style="color:var(--state-op);font-weight:600;"> ✓ datos en tiempo real</span>
      </div>
    </div>
    <div style="display:flex;gap:var(--sp-3);">
      <button class="btn btn-secondary btn-sm" onclick="abrirModalRotacion()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg> Ver rotación
      </button>
      <button class="btn btn-primary btn-sm" onclick="abrirModalNuevoTurno()">
        ${ICONS.plus} Asignar turno
      </button>
    </div>
  </div>
  ${proximoCard}
  ${kpisHtml}
  <div class="tabs">${tabsHtml}</div>
  ${contenido}`;

  return '';
}

// -- Personal Supabase --
async function cargarColaboradoresSupabase() {
  try {
    const { data: colabs, error: e1 } = await supabaseClient
      .schema('rrhh').from('colaboradores')
      .select('id,codigo_empleado,username,nombres,apellidos,iniciales,correo_corporativo,gmail_empresa,celular,estado_laboral,activo,cargo_id,ciudad_id')
      .eq('activo', true).order('apellidos');
    if (e1) throw e1;
    const { data: ciudades } = await supabaseClient.schema('rrhh').from('ciudades').select('id,codigo,nombre');
    const { data: cargos }   = await supabaseClient.schema('rrhh').from('cargos').select('id,nombre');
    const { data: disps }    = await supabaseClient.schema('rrhh').from('disponibilidades').select('colaborador_id,tipo,fecha_inicio,fecha_fin,activo').eq('activo', true);
    window._disponibilidadesCache = disps || [];
    const cm = Object.fromEntries((ciudades||[]).map(c => [c.id, c]));
    const km = Object.fromEntries((cargos||[]).map(c => [c.id, c]));
    return (colabs||[]).map(c => ({ ...c, ciudad: cm[c.ciudad_id]||null, cargo: km[c.cargo_id]||null }));
  } catch(err) { console.error('Error cargando colaboradores:', err); return []; }
}

  </div>`;

  let colabs = PYL.colaboradores.filter(c => {
    if (App.filtroGrupo  !== 'all' && c.grupo !== App.filtroGrupo) return false;

      const q = App.busqueda.toLowerCase();
      return c.nombre.toLowerCase().includes(q) || c.iniciales.toLowerCase().includes(q) || (c.clientes||[]).join(' ').toLowerCase().includes(q);

  });

  const taskHeaders = (tareas).map(t => `<th class="task-cell" data-tooltip="${t.label}">${t.abbr}</th>`).join('');
  const grupos = PYL.grupos || [];

async function cargarKpisSupabase() {
  try {
    const { data: colabs } = await supabaseClient.schema('rrhh').from('colaboradores').select('id,estado_laboral,activo').eq('activo', true);
    const hoy = new Date().toISOString().split('T')[0];
    const { data: disps } = await supabaseClient.schema('rrhh').from('disponibilidades').select('colaborador_id,tipo,fecha_inicio,fecha_fin,activo').eq('activo', true);
    const en30 = new Date(); en30.setDate(en30.getDate()+30);
    const { data: turnos } = await supabaseClient.schema('rrhh').from('turnos').select('id,fecha_inicio,fecha_fin').gte('fecha_inicio',hoy).lte('fecha_inicio',en30.toISOString().split('T')[0]);
    const total = (colabs||[]).length;
    const da = (disps||[]).filter(d => d.fecha_inicio<=hoy&&(!d.fecha_fin||d.fecha_fin>=hoy));
    const conDisp = new Set(da.map(d=>d.colaborador_id));
    return { totalColaboradores:total, personalOperativo:total-conDisp.size, enMaternidad:da.filter(d=>['maternidad','lactancia'].includes(d.tipo)).length, enVacaciones:da.filter(d=>d.tipo==='vacaciones').length, turnosSemana:(turnos||[]).length, clientesActivos:PYL.kpis.clientesActivos, actividadesDetenidas:PYL.kpis.actividadesDetenidas, actividadesReplanificadas:PYL.kpis.actividadesReplanificadas, tsActivas:PYL.kpis.tsActivas, dispsActivas:da, colabs:colabs||[] };
  } catch(err) { console.error('Error KPIs:', err); return PYL.kpis; }
}

function cambiarMesTurnos(dir) {
  let mes  = TurnosState.mesActual + dir;
  let anio = TurnosState.anioActual;
  if (mes > 11) { mes = 0;  anio++; }
  if (mes < 0)  { mes = 11; anio--; }
  TurnosState.mesActual  = mes;
  TurnosState.anioActual = anio;
  document.getElementById('appMain').innerHTML = renderTurnos();
}

    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="guardarCambiosTurno('${id}')">
      Guardar cambios
    </button>`;
  overlay.classList.add('open');
}

function guardarCambiosTurno(id) {
  const t = PYL.turnosMock.find(x => x.id === id);
  if (!t) return;
  const estado     = document.getElementById('turnoEstado')?.value;
  const reemplazo  = document.getElementById('turnoReemplazo')?.value;
  t.confirmado     = estado === 'confirmado';
  t.reemplazante   = reemplazo || null;
  closeModal();
  document.getElementById('appMain').innerHTML = renderTurnos();
  showToast('Turno actualizado correctamente', 'success');
}

function confirmarTurno(id) {
  const t = PYL.turnosMock.find(x => x.id === id);
  if (t) {
    t.confirmado = true;
    document.getElementById('appMain').innerHTML = renderTurnos();
    showToast(`Turno de ${t.planificador} confirmado`, 'success');
  }
}

function guardarNuevoTurno() {
  const inicio = document.getElementById('nuevoTurnoInicio')?.value;
  const fin    = document.getElementById('nuevoTurnoFin')?.value;
  const plan   = document.getElementById('nuevoTurnoPlan')?.value;
  const ciudad = document.getElementById('nuevoTurnoCiudad')?.value;

  if (!inicio || !fin || !plan) {
    showToast('Completa todos los campos', 'error');
    return;
  }

  const partes   = plan.split(' ');
  const iniciales= (partes[0][0] + (partes[1]?.[0] || '')).toUpperCase();
  const nuevoId  = 't' + Date.now();

  PYL.turnosMock.push({
    id: nuevoId, fecha_inicio: inicio, fecha_fin: fin,
    planificador: plan, iniciales, ciudad,
    confirmado: false, reemplazante: null,
  });

  // Ordenar por fecha
  PYL.turnosMock.sort((a,b) => a.fecha_inicio.localeCompare(b.fecha_inicio));

  // Ir al mes del nuevo turno
  const d = parseFecha(inicio);
  TurnosState.mesActual  = d.getMonth();
  TurnosState.anioActual = d.getFullYear();

  closeModal();
  document.getElementById('appMain').innerHTML = renderTurnos();
  showToast(`Turno asignado a ${plan}`, 'success');
}

  const overlay = document.getElementById('modalOverlay');
  document.getElementById('modalTitleEl').textContent = 'Orden de Rotación';

function cambiarVista(vista) {
  App.vistaPersonal = vista;

  const cards = colaboradores.map(renderPersonalCard).join('');

  document.querySelectorAll('.view-toggle-btn').forEach(btn => {

function renderPersonalLista(colaboradores) {
  const hoy = new Date().toISOString().split('T')[0];
  const dispsCache = window._disponibilidadesCache || [];

  const filas = colaboradores.map(c => {
    const dispActiva = dispsCache.find(d =>
      d.colaborador_id === c.id &&
      d.fecha_inicio <= hoy &&
      (!d.fecha_fin || d.fecha_fin >= hoy) &&
      d.activo
    );
    const dispTipo  = dispActiva ? dispActiva.tipo : 'operativo';
    const b         = PYL.getDisponibilidadBadge(dispTipo);
    const iniciales = c.iniciales || (c.apellidos||'').substring(0,2).toUpperCase();
    const ciudad    = c.ciudad?.codigo || '';
    const ciudadNom = c.ciudad?.nombre || '';
    const cargoNom  = c.cargo?.nombre  || '';
    const nombre    = ((c.apellidos||'') + ' ' + (c.nombres||'')).trim();
    return `
      <div class="personal-list-row" onclick="verDetalleColaborador('${c.id}')">
        <div class="initials-badge ${PYL.getCityClass(ciudad)}"
             style="width:36px;height:36px;font-size:11px;">${iniciales}</div>
        <div>
          <div class="personal-list-nombre">${nombre}</div>
          <div class="personal-list-sub">${cargoNom}</div>
        </div>
        <div class="personal-list-cell">${ciudadNom}</div>
        <div class="personal-list-cell" style="font-family:var(--font-mono);color:var(--accent);">
          @${c.username || '—'}
        </div>
        <div class="personal-list-cell">${c.celular || '—'}</div>
        <div class="personal-list-cell" style="font-size:10px;overflow:hidden;text-overflow:ellipsis;">
          ${c.gmail_empresa || '—'}
        </div>
        <div><span class="badge ${b.cls}">${b.label}</span></div>
      </div>`;
  }).join('');

  return `
    <div class="personal-list">
      <div class="personal-list-row personal-list-header">
        <div></div>
        <div>Colaborador</div>
        <div>Ciudad</div>
        <div>Username</div>
        <div>Celular</div>
        <div>Gmail</div>
        <div>Estado</div>
      </div>
      ${filas || '<div style="padding:32px;text-align:center;color:var(--text-muted);">Sin datos</div>'}

// Adaptar turnosMock al formato que usa buildTurnosHTML
function getTurnosData() {
  return (PYL.turnosMock || []).map(t => ({
    id:           t.id,
    fecha_ini:    t.fecha_inicio,
    fecha_fin:    t.fecha_fin,
    fecha_label:  formatFechaCorta(t.fecha_inicio) + ' - ' + formatFechaCorta(t.fecha_fin),
    planificador: t.planificador,
    iniciales:    t.iniciales,
    ciudad:       t.ciudad,
    tipo:         'Fin de semana',
    confirmado:   t.confirmado,
    reemplazante: t.reemplazante || null,
  }));
}

function buildTurnosHTML(vista) {
  App.vistaTurnos = vista;
  const hoy   = new Date();
  const hoyStr = hoy.toISOString().split('T')[0];

  // Separar turnos: próximos y pasados
  const proximos  = getTurnosData().filter(t => t.fecha_fin >= hoyStr)
                      .sort((a,b) => a.fecha_ini.localeCompare(b.fecha_ini));
  const pasados   = getTurnosData().filter(t => t.fecha_fin < hoyStr)
                      .sort((a,b) => b.fecha_ini.localeCompare(a.fecha_ini));

  // Próximo turno destacado
  const siguiente = proximos[0];
  const diasFaltan = siguiente
    ? Math.ceil((new Date(siguiente.fecha_ini) - hoy) / 86400000)
    : null;

  const turnoDestacadoHtml = siguiente ? `
    <div style="
      background: linear-gradient(135deg, #0F1923 0%, #1A2B3C 100%);
      border-radius: var(--r-xl);
      padding: var(--sp-5) var(--sp-6);
      margin-bottom: var(--sp-5);
      display: flex;
      align-items: center;
      gap: var(--sp-5);
      color: #fff;
      box-shadow: var(--shadow-md);
    ">
      <div style="
        width: 64px; height: 64px;
        background: var(--accent);
        border-radius: var(--r-xl);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        flex-shrink: 0;
      ">
        <div style="font-size: 22px; font-weight: 800; font-family: var(--font-mono); line-height:1;">
          ${diasFaltan === 0 ? '¡HOY!' : diasFaltan}
        </div>
        ${diasFaltan > 0 ? `<div style="font-size: 9px; opacity: .8; letter-spacing:.05em;">DÍAS</div>` : ''}
      </div>
      <div style="flex:1;">
        <div style="font-size: 11px; opacity:.5; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px;">
          Próximo turno
        </div>
        <div style="font-size: 18px; font-weight: 700; margin-bottom: 4px;">
          ${siguiente.planificador}
        </div>
        <div style="font-size: 13px; opacity: .7;">
          ${siguiente.fecha_label} · ${siguiente.tipo}
          ${siguiente.ciudad ? `· ${siguiente.ciudad}` : ''}
        </div>
      </div>
      <div style="display:flex;gap:var(--sp-2);">
        <button class="btn btn-sm"
          style="background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);"
          onclick="openModalReemplazo('${siguiente.id}','${siguiente.planificador}','${siguiente.fecha_label}')">
          ↔ Reemplazo
        </button>
        <button class="btn btn-sm"
          style="background:var(--accent);color:#fff;"
          onclick="openModalEditarTurno('${siguiente.id}')">
          ✎ Editar
        </button>
      </div>
    </div>` : '';

  // Stats rápidas
  const statsHtml = `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3);margin-bottom:var(--sp-5);">
      ${[
        { label:'Turnos este año',  value: getTurnosData().length,    color:'var(--accent)' },
        { label:'Próximos',         value: proximos.length,           color:'var(--state-op)' },
        { label:'Realizados',       value: pasados.length,            color:'var(--text-muted)' },
        { label:'Con reemplazo',    value: getTurnosData().filter(t=>t.reemplazante).length, color:'var(--state-mat)' },
      ].map(s => `
        <div class="card" style="padding:var(--sp-4);text-align:center;">
          <div style="font-size:24px;font-weight:800;font-family:var(--font-mono);color:${s.color};">
            ${s.value}
          </div>
          <div style="font-size:var(--text-xs);color:var(--text-muted);margin-top:4px;">${s.label}</div>
        </div>
      `).join('')}
    </div>`;

  // Tabs
  const tabs = ['lista','calendario','historial'].map(v => `
    <div class="tab ${vista === v ? 'active' : ''}"
         onclick="document.getElementById('turnosContent').outerHTML = buildTurnosHTML('${v}')">
      ${{ lista:'☰ Lista', calendario:'📅 Calendario', historial:'🕐 Historial' }[v]}
    </div>`).join('');

  // ── Vista Lista ──────────────────────────────────────────
  const filasTurnos = (vista === 'historial' ? pasados : proximos).map((t, i) => {
    const esPasado = t.fecha_fin < hoyStr;
    const esHoy    = t.fecha_ini <= hoyStr && t.fecha_fin >= hoyStr;
    return `
      <div class="turno-row" style="
        animation:fadeIn .12s ease ${i*25}ms both;
        ${esPasado ? 'opacity:.5;' : ''}
        ${esHoy ? 'background:var(--accent-light);border-left:3px solid var(--accent);' : ''}
      ">
        <div class="turno-fecha" style="min-width:130px;">${t.fecha_label}</div>
        <div class="turno-planificador">
          ${initBadge(t.iniciales, t.ciudad)}
          <div>
            <div class="turno-nombre">${t.planificador}</div>
            ${t.reemplazante ? `
              <div style="font-size:10px;color:var(--state-mat);">
                ↔ Cubre: ${t.reemplazante}
              </div>` : ''}
          </div>
        </div>
        <div style="margin-left:auto;display:flex;align-items:center;gap:var(--sp-2);">
          ${esHoy ? `<span class="badge badge-op">HOY</span>` : ''}
          <span class="badge badge-neutral">${t.tipo}</span>
          ${t.reemplazante
            ? `<span class="badge badge-mat" style="font-size:10px;">Reemplazo</span>`
            : ''}
          <button class="btn btn-ghost btn-sm btn-icon"
                  onclick="openModalEditarTurno('${t.id}')" title="Editar">✎</button>
          ${!esPasado ? `
            <button class="btn btn-ghost btn-sm btn-icon"
                    onclick="openModalReemplazo('${t.id}','${t.planificador}','${t.fecha_label}')"
                    title="Registrar reemplazo">↔</button>` : ''}
        </div>
      </div>`;
  }).join('');

  // ── Vista Calendario ─────────────────────────────────────
  const mesesMap = {};
  proximos.forEach(t => {
    const mes = t.fecha_ini.substring(0,7); // YYYY-MM
    if (!mesesMap[mes]) mesesMap[mes] = [];
    mesesMap[mes].push(t);
  });

  const calendarioHtml = Object.entries(mesesMap).map(([mes, turnos]) => {
    const [anio, numMes] = mes.split('-');
    const nomMes = new Date(anio, numMes-1, 1)
      .toLocaleDateString('es-EC', { month:'long', year:'numeric' });
    return `
      <div class="card mb-4">
        <div class="card-header">
          <div class="card-title" style="text-transform:capitalize;">${nomMes}</div>
          <span class="badge badge-neutral">${turnos.length} turno${turnos.length>1?'s':''}</span>
        </div>
        <div class="card-body" style="padding:0;">
          ${turnos.map(t => `
            <div class="turno-row" style="border-bottom:1px solid var(--border);">

              <div class="turno-planificador">
                ${initBadge(t.iniciales, t.ciudad)}
                <span class="turno-nombre">${t.planificador}</span>
              </div>
              <span class="badge badge-neutral" style="margin-left:auto;">${t.tipo}</span>
            </div>`).join('')}
        </div>
      </div>`;
  }).join('');

  const contenido = vista === 'calendario'
    ? calendarioHtml || '<div class="empty"><div class="empty-title">Sin turnos próximos</div></div>'
    : `<div class="card">
        <div class="card-header">
          <div class="card-title">
            ${vista === 'historial' ? 'Turnos Realizados' : 'Próximos turnos programados'}
          </div>
          <span class="badge badge-neutral">${(vista==='historial'?pasados:proximos).length} registros</span>
        </div>
        <div class="card-body" style="padding:0;">
          <div class="turno-list" style="padding:var(--sp-2) var(--sp-4);">
            ${filasTurnos || '<div class="empty"><div class="empty-title">Sin registros</div></div>'}
          </div>
        </div>
       </div>`;

  return `<div id="turnosContent">
    ${turnoDestacadoHtml}
    ${statsHtml}
    <div class="tabs">${tabs}</div>
    ${contenido}
  </div>`;
}

function guardarReemplazo(turnoId) {
  const reemplazante = document.getElementById('reemplazanteSelect')?.value;

  const t = getTurnosData().find(x => x.id === turnoId);
  if (!t) return;
  t.planificador = document.getElementById('editPlanificador')?.value || t.planificador;
  t.fecha_ini    = document.getElementById('editFechaIni')?.value    || t.fecha_ini;
  t.fecha_fin    = document.getElementById('editFechaFin')?.value    || t.fecha_fin;
  t.tipo         = document.getElementById('editTipo')?.value        || t.tipo;
  t.obs          = document.getElementById('editObs')?.value         || '';
  // Recalcular label
  const fi = new Date(t.fecha_ini + 'T00:00:00');
  const ff = new Date(t.fecha_fin + 'T00:00:00');
  const fmt = d => d.toLocaleDateString('es-EC',{day:'2-digit',month:'short'}).toUpperCase();
  t.fecha_label = `${fmt(fi)} — ${fmt(ff)}`;
  closeModal();
  showToast('Turno actualizado', 'success');
  renderModule();
}

function guardarNuevoTurno() {
  const plan = document.getElementById('nuevoTurnoPlan')?.value;
  const ini  = document.getElementById('nuevoTurnoIni')?.value;
  const fin  = document.getElementById('nuevoTurnoFin')?.value;
  const tipo = document.getElementById('nuevoTurnoTipo')?.value;
  const ciudad = document.getElementById('nuevoTurnoCiudad')?.value;

  if (!plan || !ini || !fin) {
    showToast('Completa planificador y fechas', 'error');
    return;
  }

  const fi  = new Date(ini + 'T00:00:00');
  const ff  = new Date(fin + 'T00:00:00');
  const fmt = d => d.toLocaleDateString('es-EC',{day:'2-digit',month:'short'}).toUpperCase();

  // Iniciales del colaborador
  const colab = (window._colaboradoresCache || []).find(c => {
    const n = ((c.apellidos||'') + ' ' + (c.nombres||'')).trim();
    return n === plan;
  });
  const inic = colab?.iniciales || plan.substring(0,2).toUpperCase();

  getTurnosData().push({
    id:          'T' + Date.now(),
    planificador: plan,
    iniciales:   inic,
    ciudad:      ciudad,
    fecha_ini:   ini,
    fecha_fin:   fin,
    fecha_label: `${fmt(fi)} — ${fmt(ff)}`,
    tipo:        tipo,
    reemplazante: null,
    obs:          '',
  });

  closeModal();
  showToast(`Turno asignado a ${plan}`, 'success');
  renderModule();
}

async function abrirGrupoWhatsApp(encoded) {
  // 1. Decodificar y copiar el mensaje al portapapeles
  const texto = decodeURIComponent(encoded);

  try {
    await navigator.clipboard.writeText(texto);
    copiadoExitoso();
  } catch(e) {
    // Fallback para navegadores sin permiso de clipboard
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    ta.remove();
    copiadoExitoso();
  }
}

function copiadoExitoso() {
  document.getElementById('waOverlay')?.remove();

  // Mostrar instrucción antes de abrir el grupo
  const toast = document.createElement('div');
  toast.style.cssText = `

// ── Interacciones ─────────────────────────────────────────
function toggleTarea(colaboradorId, tareaKey, el) {
  if (!App.tareas[colaboradorId]) App.tareas[colaboradorId] = {};
  App.tareas[colaboradorId][tareaKey] = !App.tareas[colaboradorId][tareaKey];
  const checked = App.tareas[colaboradorId][tareaKey];
  el.classList.toggle('checked', checked);
  el.setAttribute('aria-checked', checked);
  showToast(`Tarea ${checked ? 'marcada' : 'desmarcada'}`, 'success');
}

function changeSemana(dir) {
  const newIdx = App.semanaIdx + dir;
  if (newIdx >= 0 && newIdx < PYL.semanas.length) {
    App.semanaIdx = newIdx;
    renderModule();
  }
}

function copyPlantilla(btn, encoded) {
  const text = decodeURIComponent(encoded);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copiado';
    setTimeout(() => { btn.textContent = 'Copiar'; }, 2000);
    showToast('Plantilla copiada al portapapeles', 'success');
  });
}

// ── Toast ─────────────────────────────────────────────────
function showToast(msg, type = 'default') {
  const container = document.getElementById('toastContainer');
  const icons = { success: ICONS.check, error: ICONS.alert, default: ICONS.activity };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${icons[type] || icons.default}</span>${msg}`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(24px)';
    toast.style.transition = 'all .2s ease';
    setTimeout(() => toast.remove(), 220);
  }, 2800);
}

// ── Router / Render principal ─────────────────────────────
function navigate(modulo) {
  App.modulo = modulo;
  // Reset filtros al cambiar módulo
  if (modulo !== 'planning') {
    App.busqueda = '';
  }
  render();
}

const moduleTitles = {
  dashboard: ['Dashboard', 'Panel General'],
  planning:  ['Distribución Semanal', 'PYL — Planificación y Logística'],
  personal:  ['Personal', 'Equipo PYL'],
  turnos:    ['Turnos', 'Fin de Semana — Rotación Anual'],
  clientes:  ['Clientes', 'Gestión de Clientes Nacionales'],
  ts:        ['Técnicas Sucursales', 'Coordinadores y Cobertura'],
  motivos:   ['Motivos y Plantillas', 'Textos Estándar Operativos'],
  acuerdos:  ['Acuerdos y Directrices', 'Operativo Vigente'],
};

function renderModule() {
  const [title, sub] = moduleTitles[App.modulo] || ['PYL', ''];

  // Actualizar header de forma segura
  const header = document.getElementById('appHeader');
  if (header) header.outerHTML = renderHeader(title, sub);

  // Re-obtener main DESPUÉS de modificar el header
  const main = document.getElementById('appMain');
  if (!main) { console.error('appMain no encontrado'); return; }

  const renders = {
    dashboard: renderDashboard,
    planning:  renderPlanning,
    personal:  renderPersonal,
    turnos:    renderTurnos,
    clientes:  renderClientes,
    ts:        renderTS,
    motivos:   renderMotivos,
    acuerdos:  renderAcuerdos,
  };

  const fn = renders[App.modulo] || renderDashboard;
  const asyncModulos = ['personal', 'dashboard', 'turnos'];



  if (asyncModulos.includes(App.modulo)) {
    main.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">Cargando...</div>';
    const resultado = fn();
    // Si es Promise, manejar el error; si no, ignorar
    if (resultado && typeof resultado.catch === 'function') {
      resultado.catch(e => {
        console.error('Error en módulo async:', e);
        main.innerHTML = '<div style="padding:40px;text-align:center;color:var(--state-det);">Error: ' + e.message + '</div>';
      });
    }
  } else {
    main.innerHTML = fn();
  }
}

function render() {
  const shell = document.getElementById('appShell');
  const [title, sub] = moduleTitles[App.modulo] || ['PYL', ''];

  shell.innerHTML = `
    ${renderSidebar()}
    <div id="appHeader">${renderHeader(title, sub)}</div>
    <main class="app-main" id="appMain"></main>
  `;

  renderModule();

  // Rebind nav (sidebar se regenera)
  $$('.nav-item').forEach(el => {
    el.addEventListener('click', function() {
      const mod = this.getAttribute('onclick')?.match(/navigate\('(\w+)'\)/)?.[1];
      if (mod) {
        $$('.nav-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
      }
    });
  });
}

}

  <script>
    // ─────────────────────────────────────────────────────────
    // CONFIGURACIÓN

    const SUPABASE_URL  = 'https://uulyksqyhxnxeaojgejv.supabase.co';

    // Dominios permitidos — gmail.com para pruebas + corporativo
    const ALLOWED_DOMAINS = ['gmail.com', 'telconet.ec'];

    // ─────────────────────────────────────────────────────────
    // CLIENTE SUPABASE
    // ─────────────────────────────────────────────────────────
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON);

    // ─────────────────────────────────────────────────────────
    // LOGIN CON GOOGLE
    // ─────────────────────────────────────────────────────────
    async function doLogin() {
      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + window.location.pathname,
            queryParams: {
              prompt: 'select_account',
              access_type: 'offline',
            }
          }
        });
        if (error) {
          console.error('OAuth error:', error);
          showToast('Error al conectar con Google. Intenta de nuevo.', 'error');
        }
      } catch (err) {
        console.error('Login error:', err);
        showToast('Error inesperado. Intenta de nuevo.', 'error');
      }

    // ─────────────────────────────────────────────────────────
    // VALIDAR DOMINIO
    // ─────────────────────────────────────────────────────────
    function isDomainAllowed(email) {
      if (!email) return false;
      const domain = email.split('@')[1]?.toLowerCase();
      return ALLOWED_DOMAINS.includes(domain);
    }

    // ─────────────────────────────────────────────────────────
    // PANTALLA DE ACCESO DENEGADO
    // ─────────────────────────────────────────────────────────
    function showAccessDenied(email) {
      document.getElementById('loginContainer').innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;
                    justify-content:center;background:#0F1923;">
          <div style="background:#1A2B3C;border-radius:16px;padding:40px;
                      max-width:420px;text-align:center;">
            <div style="font-size:48px;margin-bottom:16px;">⛔</div>
            <div style="color:#fff;font-size:18px;font-weight:700;margin-bottom:8px;">
              Acceso no autorizado
            </div>
            <div style="color:rgba(255,255,255,.5);font-size:14px;margin-bottom:24px;line-height:1.6;">
              La cuenta <strong style="color:#fff;">${email}</strong>
              no tiene acceso al sistema PYL.<br>
              Contacta al administrador si crees que esto es un error.
            </div>
            <button onclick="window.location.reload()"
              style="background:#00A8E8;color:#fff;border:none;
                     padding:10px 24px;border-radius:8px;
                     font-size:14px;font-weight:600;cursor:pointer;">
              Intentar con otra cuenta
            </button>
          </div>
        </div>`;
    }

    // ─────────────────────────────────────────────────────────
    // INICIAR LA APP CON DATOS DEL USUARIO
    // ─────────────────────────────────────────────────────────
    function bootApp(session) {
      const user     = session.user;
      const email    = user.email;
      const name     = user.user_metadata?.full_name || email;
      const parts    = name.trim().split(' ');
      const initials = parts.length >= 2
        ? parts[0][0] + parts[parts.length - 1][0]
        : name.slice(0, 2);

      window.CURRENT_USER = {
        id:       user.id,
        email:    email,
        name:     name,
        initials: initials.toUpperCase(),
        avatar:   user.user_metadata?.avatar_url || null,
        role:     'coordinador',
      };

      document.getElementById('loginContainer').classList.add('hidden');
      document.getElementById('appShell').classList.remove('hidden');
      document.getElementById('toastContainer').classList.remove('hidden');

      render();
      showToast('Bienvenida, ' + name.split(' ')[0], 'success');
    }

    // ─────────────────────────────────────────────────────────
    // CERRAR SESIÓN
    // ─────────────────────────────────────────────────────────
    async function doLogout() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    // ─────────────────────────────────────────────────────────
    // LISTENER PRINCIPAL DE SESIÓN
    // ─────────────────────────────────────────────────────────
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      console.log('Auth event:', event);

      if (event === 'SIGNED_IN' && session) {
        const email = session.user.email;

        if (!isDomainAllowed(email)) {
          await supabaseClient.auth.signOut();
          showAccessDenied(email);
          return;
        }

        bootApp(session);
      }

      if (event === 'SIGNED_OUT') {
        document.getElementById('loginContainer').classList.remove('hidden');
        document.getElementById('appShell').classList.add('hidden');
        document.getElementById('toastContainer').classList.add('hidden');
      }
    });

    // ─────────────────────────────────────────────────────────
    // VERIFICAR SESIÓN EXISTENTE AL CARGAR
    // ─────────────────────────────────────────────────────────
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        const email = session.user.email;
        if (isDomainAllowed(email)) {
          bootApp(session);
        } else {
          await supabaseClient.auth.signOut();
          showAccessDenied(email);
        }
      }
    })();

    // ─────────────────────────────────────────────────────────
    // HELPERS MODAL Y TECLADO
    // ─────────────────────────────────────────────────────────

    }
