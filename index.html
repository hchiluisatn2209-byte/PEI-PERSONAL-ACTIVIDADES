<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PYL System — Planificación y Logística Telconet">
  <title>PYL System — Telconet</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230F1923'/><polyline points='22,12 18,12 15,21 9,3 6,12 2,12' fill='none' stroke='%2300A8E8' stroke-width='2.5'/></svg>">
  <style>
/* ============================================================
   PYL SYSTEM — Planificación y Logística — Telconet
   Design System / Main CSS
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

/* ── Tokens ─────────────────────────────────────────────── */
:root {
  /* Surface */
  --bg-app:       #0F1923;
  --bg-sidebar:   #0F1923;
  --bg-panel:     #1A2B3C;
  --bg-content:   #F0F4F8;
  --bg-card:      #FFFFFF;
  --bg-row-alt:   #F7FAFC;

  /* Brand */
  --accent:       #00A8E8;
  --accent-dark:  #0086BB;
  --accent-light: #E6F7FF;

  /* Estado-color */
  --state-op:     #10B981;  /* Operativo */
  --state-op-bg:  #ECFDF5;
  --state-mat:    #F59E0B;  /* Maternidad/Lactancia */
  --state-mat-bg: #FFFBEB;
  --state-vac:    #8B5CF6;  /* Vacaciones */
  --state-vac-bg: #F5F3FF;
  --state-det:    #EF4444;  /* Detenida */
  --state-det-bg: #FEF2F2;
  --state-rep:    #F97316;  /* Replanificada */
  --state-rep-bg: #FFF7ED;
  --state-med:    #06B6D4;  /* Permiso médico */
  --state-med-bg: #ECFEFF;

  /* Ciudad-color (badges) */
  --city-uio:     #2563EB;
  --city-gye:     #DC2626;
  --city-mil:     #7C3AED;
  --city-other:   #475569;

  /* Texto */
  --text-primary:   #0F172A;
  --text-secondary: #475569;
  --text-muted:     #94A3B8;
  --text-inverse:   #F8FAFC;
  --text-accent:    #00A8E8;

  /* Bordes */
  --border:       #E2E8F0;
  --border-dark:  #CBD5E1;

  /* Tipografía */
  --font-ui:   'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;

  /* Escala */
  --text-xs:   0.6875rem; /* 11px */
  --text-sm:   0.75rem;   /* 12px */
  --text-base: 0.875rem;  /* 14px */
  --text-md:   1rem;      /* 16px */
  --text-lg:   1.125rem;  /* 18px */
  --text-xl:   1.375rem;  /* 22px */

  /* Espaciado */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* Sidebar */
  --sidebar-w: 220px;
  --header-h:  56px;

  /* Radios */
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-full: 9999px;

  /* Sombras */
  --shadow-sm:  0 1px 3px rgba(0,0,0,.08);
  --shadow-md:  0 4px 12px rgba(0,0,0,.10);
  --shadow-lg:  0 8px 24px rgba(0,0,0,.14);
  --shadow-card:0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.08);

  /* Transiciones */
  --ease: cubic-bezier(.4,0,.2,1);
  --t-fast: 120ms;
  --t-base: 200ms;
}

/* ── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-ui);
  font-size: var(--text-base);
  color: var(--text-primary);
  background: var(--bg-content);
  line-height: 1.5;
  overflow-x: hidden;
}
button { cursor: pointer; font-family: inherit; border: none; background: none; }
input, select, textarea {
  font-family: inherit;
  font-size: var(--text-base);
  outline: none;
  border: none;
}
a { color: inherit; text-decoration: none; }
img, svg { display: block; }
ul { list-style: none; }

/* ── Layout shell ───────────────────────────────────────── */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--header-h) 1fr;
  grid-template-areas:
    "sidebar header"
    "sidebar main";
  min-height: 100vh;
}

/* ── Fix sidebar fijo: header y main respetan el ancho ── */
.app-header {
  margin-left: var(--sidebar-w);
  width: calc(100% - var(--sidebar-w));
  box-sizing: border-box;
}
.app-main {
  margin-left: var(--sidebar-w);
  width: calc(100% - var(--sidebar-w));
  box-sizing: border-box;
  min-width: 0;
}

/* ── Sidebar ────────────────────────────────────────────── */
.sidebar {
  grid-area: sidebar;
  background: var(--bg-sidebar);
  color: var(--text-inverse);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  width: var(--sidebar-w);
  height: 100vh;
  z-index: 100;
  overflow-y: auto;
}

.sidebar-logo {
  padding: var(--sp-5) var(--sp-4);
  border-bottom: 1px solid rgba(255,255,255,.08);
  flex-shrink: 0;
}
.sidebar-logo-mark {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.logo-icon {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-icon svg { width: 18px; height: 18px; }
.logo-text { line-height: 1.2; }
.logo-product {
  font-size: var(--text-sm);
  font-weight: 700;
  letter-spacing: .04em;
  color: #fff;
  text-transform: uppercase;
}
.logo-company {
  font-size: var(--text-xs);
  color: rgba(255,255,255,.45);
  font-weight: 400;
}

/* Nav */
.sidebar-nav {
  flex: 1;
  padding: var(--sp-3) 0;
  overflow-y: auto;
}
.nav-section {
  margin-bottom: var(--sp-2);
}
.nav-section-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
  padding: var(--sp-3) var(--sp-4) var(--sp-1);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 9px var(--sp-4);
  font-size: var(--text-sm);
  font-weight: 500;
  color: rgba(255,255,255,.6);
  border-radius: 0;
  transition: color var(--t-fast) var(--ease),
              background var(--t-fast) var(--ease);
  position: relative;
  cursor: pointer;
}
.nav-item:hover {
  color: #fff;
  background: rgba(255,255,255,.06);
}
.nav-item.active {
  color: #fff;
  background: rgba(0,168,232,.15);
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 20px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}
.nav-icon {
  width: 16px; height: 16px;
  opacity: .7;
  flex-shrink: 0;
}
.nav-item.active .nav-icon,
.nav-item:hover .nav-icon { opacity: 1; }
.nav-badge {
  margin-left: auto;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: var(--r-full);
  min-width: 18px;
  text-align: center;
}

/* Sidebar footer */
.sidebar-footer {
  padding: var(--sp-4);
  border-top: 1px solid rgba(255,255,255,.08);
  flex-shrink: 0;
}
.user-card {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.user-avatar {
  width: 32px; height: 32px;
  border-radius: var(--r-full);
  background: var(--accent);
  color: #fff;
  font-size: var(--text-xs);
  font-weight: 700;
  font-family: var(--font-mono);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.user-info { flex: 1; min-width: 0; }
.user-name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.user-role {
  font-size: var(--text-xs);
  color: rgba(255,255,255,.4);
}

/* ── Header ─────────────────────────────────────────────── */
.app-header {
  grid-area: header;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: 0 var(--sp-6);
  position: sticky;
  top: 0;
  z-index: 50;
  /* Fix: header no queda tapado por sidebar */
  min-width: 0;
  overflow: hidden;
}
.header-title {
  font-size: var(--text-md);
  font-weight: 700;
  color: var(--text-primary);
  flex: 1;
}
.header-subtitle {
  font-size: var(--text-sm);
  font-weight: 400;
  color: var(--text-muted);
  margin-left: var(--sp-2);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}

/* ── Main content ────────────────────────────────────────── */
.app-main {
  grid-area: main;
  padding: var(--sp-6);
  overflow-y: auto;
  min-width: 0;
}

/* ── Buttons ────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 7px var(--sp-4);
  border-radius: var(--r-md);
  font-size: var(--text-sm);
  font-weight: 600;
  transition: all var(--t-fast) var(--ease);
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-dark); }
.btn-secondary {
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--bg-row-alt); border-color: var(--border-dark); }
.btn-ghost {
  color: var(--text-secondary);
  padding: 7px var(--sp-3);
}
.btn-ghost:hover { background: var(--bg-row-alt); color: var(--text-primary); }
.btn-sm {
  padding: 4px var(--sp-3);
  font-size: var(--text-xs);
  font-weight: 600;
}
.btn-icon {
  width: 32px; height: 32px;
  padding: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-md);
}
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }

/* ── Badges / Tags ──────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-size: var(--text-xs);
  font-weight: 600;
  white-space: nowrap;
}
.badge-op      { background: var(--state-op-bg);  color: var(--state-op); }
.badge-mat     { background: var(--state-mat-bg); color: var(--state-mat); }
.badge-vac     { background: var(--state-vac-bg); color: var(--state-vac); }
.badge-det     { background: var(--state-det-bg); color: var(--state-det); }
.badge-rep     { background: var(--state-rep-bg); color: var(--state-rep); }
.badge-med     { background: var(--state-med-bg); color: var(--state-med); }
.badge-neutral { background: var(--border);       color: var(--text-secondary); }

/* Iniciales badge (firma del sistema) */
.initials-badge {
  width: 32px; height: 32px;
  border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  flex-shrink: 0;
  cursor: default;
  transition: transform var(--t-fast) var(--ease),
              box-shadow var(--t-fast) var(--ease);
}
.initials-badge:hover {
  transform: scale(1.12);
  box-shadow: 0 0 0 3px rgba(255,255,255,.4);
}
.initials-badge.city-uio   { background: var(--city-uio); }
.initials-badge.city-gye   { background: var(--city-gye); }
.initials-badge.city-mil   { background: var(--city-mil); }
.initials-badge.city-other { background: var(--city-other); }
.initials-badge.sz-lg {
  width: 40px; height: 40px;
  font-size: 13px;
}

/* ── Cards ──────────────────────────────────────────────── */
.card {
  background: var(--bg-card);
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
}
.card-header {
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.card-title {
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--text-primary);
  flex: 1;
}
.card-body { padding: var(--sp-5); }

/* ── KPI Cards ──────────────────────────────────────────── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: var(--sp-4);
  margin-bottom: var(--sp-6);
}
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-4) var(--sp-5);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  box-shadow: var(--shadow-card);
  transition: box-shadow var(--t-base) var(--ease),
              transform var(--t-base) var(--ease);
}
.kpi-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.kpi-label {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .05em;
}
.kpi-value {
  font-size: 28px;
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--text-primary);
  line-height: 1;
}
.kpi-sub {
  font-size: var(--text-xs);
  color: var(--text-muted);
}
.kpi-icon {
  width: 28px; height: 28px;
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: var(--sp-1);
}
.kpi-icon svg { width: 15px; height: 15px; }
.kpi-icon.accent  { background: var(--accent-light);    color: var(--accent); }
.kpi-icon.green   { background: var(--state-op-bg);     color: var(--state-op); }
.kpi-icon.yellow  { background: var(--state-mat-bg);    color: var(--state-mat); }
.kpi-icon.red     { background: var(--state-det-bg);    color: var(--state-det); }
.kpi-icon.purple  { background: var(--state-vac-bg);    color: var(--state-vac); }

/* ── Semana Selector ────────────────────────────────────── */
.week-nav {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: var(--sp-2) var(--sp-3);
  box-shadow: var(--shadow-sm);
}
.week-nav-label {
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--text-primary);
  white-space: nowrap;
  min-width: 200px;
  text-align: center;
}
.week-nav-sub {
  font-size: var(--text-xs);
  color: var(--text-muted);
  text-align: center;
}
.week-btn {
  width: 30px; height: 30px;
  border-radius: var(--r-full);
  background: var(--bg-row-alt);
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--t-fast) var(--ease);
  flex-shrink: 0;
}
.week-btn:hover { background: var(--accent); color: #fff; }
.week-btn svg { width: 14px; height: 14px; }

/* ── Tabla de Distribución Semanal ──────────────────────── */
.dist-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.dist-toolbar {
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  flex-wrap: wrap;
}
.dist-toolbar-title {
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--text-primary);
  flex: 1;
}

/* Filtros inline */
.filter-group {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.filter-select {
  padding: 5px var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--text-primary);
  background: var(--bg-card);
  cursor: pointer;
  transition: border-color var(--t-fast);
}
.filter-select:hover { border-color: var(--accent); }
.filter-select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }

/* Scroll container */
.dist-scroll {
  overflow-x: auto;
  overflow-y: auto;
  max-height: calc(100vh - 320px);
}

/* Tabla */
.dist-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-sm);
  min-width: 900px;
}

/* Headers */
.dist-table thead {
  position: sticky;
  top: 0;
  z-index: 20;
}
.dist-table th {
  background: var(--bg-app);
  color: rgba(255,255,255,.75);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: var(--sp-3) var(--sp-3);
  text-align: left;
  white-space: nowrap;
  border-right: 1px solid rgba(255,255,255,.08);
}
.dist-table th:last-child { border-right: none; }
.dist-table th.col-sticky {
  position: sticky;
  left: 0;
  z-index: 25;
  background: var(--bg-app);
}

/* Rows */
.dist-table tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background var(--t-fast) var(--ease);
}
.dist-table tbody tr:hover { background: var(--accent-light); }
.dist-table tbody tr:last-child { border-bottom: none; }

/* Separador de grupo (PROYECTOS CRM / OTS MASIVAS / TERCERIZADOS) */
.dist-table tbody tr.group-header td {
  background: var(--bg-panel);
  color: var(--text-inverse);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 6px var(--sp-3);
  position: sticky;
  left: 0;
  z-index: 10;
}
.dist-table tbody tr.group-header td .group-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: var(--r-full);
  margin-right: var(--sp-2);
  vertical-align: middle;
}

/* Celdas */
.dist-table td {
  padding: 10px var(--sp-3);
  vertical-align: middle;
  border-right: 1px solid var(--border);
  white-space: nowrap;
}
.dist-table td:last-child { border-right: none; }

/* Columna sticky: nombre planificador */
.col-planificador {
  position: sticky;
  left: 0;
  background: var(--bg-card);
  z-index: 10;
  min-width: 200px;
  max-width: 200px;
  white-space: nowrap;
}
.dist-table tbody tr:hover .col-planificador { background: var(--accent-light); }

.planner-cell {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.planner-info { flex: 1; min-width: 0; }
.planner-name {
  font-weight: 600;
  font-size: var(--text-sm);
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.planner-cargo {
  font-size: var(--text-xs);
  color: var(--text-muted);
}

/* Columna TS */
.ts-cell {
  min-width: 180px;
  max-width: 220px;
}
.ts-value {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--accent-dark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
  display: block;
}
.ts-empty {
  font-size: var(--text-xs);
  color: var(--text-muted);
  font-style: italic;
}

/* Columna clientes */
.clientes-cell {
  min-width: 200px;
  max-width: 260px;
}
.cliente-tags {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.cliente-tag {
  font-size: var(--text-xs);
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 240px;
}

/* Columna backup */
.backup-cell {
  min-width: 90px;
}
.backup-pair {
  display: flex;
  gap: var(--sp-1);
  align-items: center;
}
.backup-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: var(--r-sm);
  background: var(--bg-row-alt);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

/* Columna disponibilidad */
.dispon-cell { min-width: 100px; }

/* Columna observaciones */
.obs-cell {
  min-width: 160px;
  max-width: 200px;
}
.obs-text {
  font-size: var(--text-xs);
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
  display: block;
  cursor: pointer;
}
.obs-text:hover { color: var(--accent); }

/* Columnas checkbox de tareas */
.task-cell {
  min-width: 36px;
  max-width: 44px;
  text-align: center;
  padding: 8px var(--sp-2);
}
.task-check {
  width: 18px; height: 18px;
  border-radius: var(--r-sm);
  border: 1.5px solid var(--border-dark);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto;
  transition: all var(--t-fast) var(--ease);
  cursor: pointer;
  flex-shrink: 0;
}
.task-check.checked {
  background: var(--state-op);
  border-color: var(--state-op);
}
.task-check.checked svg {
  display: block;
  width: 11px; height: 11px;
  color: #fff;
}
.task-check:not(.checked) svg { display: none; }
.task-check:hover { border-color: var(--accent); }

/* Celdas de indisponibilidad (row highlight) */
.dist-table tbody tr.row-maternidad td { background: #FFFBEB; }
.dist-table tbody tr.row-maternidad:hover td { background: #FEF9C3; }
.dist-table tbody tr.row-vacaciones td { background: #F5F3FF; }
.dist-table tbody tr.row-vacaciones:hover td { background: #EDE9FE; }
.dist-table tbody tr.row-medico td { background: #ECFEFF; }
.dist-table tbody tr.row-maternidad .col-planificador,
.dist-table tbody tr.row-vacaciones .col-planificador,
.dist-table tbody tr.row-medico .col-planificador {
  background: inherit;
}

/* ── Módulo Personal ─────────────────────────────────────── */
.personal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--sp-4);
}
.personal-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-5);
  box-shadow: var(--shadow-card);
  transition: box-shadow var(--t-base) var(--ease), transform var(--t-base) var(--ease);
  cursor: pointer;
}
.personal-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.personal-card-header {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}
.personal-card-info { flex: 1; min-width: 0; }
.personal-name {
  font-weight: 700;
  font-size: var(--text-sm);
  color: var(--text-primary);
  line-height: 1.3;
}
.personal-cargo {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-top: 2px;
}
.personal-card-details {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.personal-detail {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--text-xs);
  color: var(--text-secondary);
}
.personal-detail svg { width: 12px; height: 12px; flex-shrink: 0; opacity: .6; }
.personal-card-footer {
  margin-top: var(--sp-4);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ── Turnos Calendar ─────────────────────────────────────── */
.turno-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.turno-row {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-3) var(--sp-4);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  transition: box-shadow var(--t-fast);
}
.turno-row:hover { box-shadow: var(--shadow-sm); }
.turno-fecha {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--text-secondary);
  min-width: 110px;
}
.turno-planificador {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex: 1;
}
.turno-nombre {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text-primary);
}
.turno-tipo { margin-left: auto; }

/* ── Modales ────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,25,35,.6);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-4);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-base) var(--ease);
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.modal {
  background: var(--bg-card);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  transform: translateY(16px) scale(.98);
  transition: transform var(--t-base) var(--ease);
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-header {
  padding: var(--sp-5) var(--sp-6);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.modal-title {
  font-size: var(--text-md);
  font-weight: 700;
  flex: 1;
}
.modal-body { padding: var(--sp-6); }
.modal-footer {
  padding: var(--sp-4) var(--sp-6);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--sp-3);
}

/* Formularios en modal */
.form-group { margin-bottom: var(--sp-4); }
.form-label {
  display: block;
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: var(--sp-2);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.form-input,
.form-select,
.form-textarea {
  width: 100%;
  padding: 9px var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: var(--text-sm);
  color: var(--text-primary);
  background: var(--bg-card);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-4);
}

/* ── Tabs ───────────────────────────────────────────────── */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border);
  margin-bottom: var(--sp-5);
}
.tab {
  padding: var(--sp-3) var(--sp-5);
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  cursor: pointer;
  transition: all var(--t-fast) var(--ease);
  white-space: nowrap;
}
.tab:hover { color: var(--text-primary); }
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ── Empty states ───────────────────────────────────────── */
.empty {
  padding: var(--sp-8) var(--sp-4);
  text-align: center;
}
.empty-icon {
  width: 48px; height: 48px;
  margin: 0 auto var(--sp-4);
  opacity: .25;
}
.empty-title {
  font-size: var(--text-md);
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: var(--sp-2);
}
.empty-desc {
  font-size: var(--text-sm);
  color: var(--text-muted);
}

/* ── Toast notifications ─────────────────────────────────── */
.toast-container {
  position: fixed;
  bottom: var(--sp-6);
  right: var(--sp-6);
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  pointer-events: none;
}
.toast {
  background: var(--text-primary);
  color: #fff;
  padding: var(--sp-3) var(--sp-5);
  border-radius: var(--r-lg);
  font-size: var(--text-sm);
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  pointer-events: all;
  animation: toastIn var(--t-base) var(--ease) forwards;
  max-width: 360px;
}
.toast.success { background: var(--state-op); }
.toast.error   { background: var(--state-det); }
.toast.warning { background: var(--state-mat); color: var(--text-primary); }
.toast svg { width: 16px; height: 16px; flex-shrink: 0; }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(24px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ── Tooltip ────────────────────────────────────────────── */
[data-tooltip] {
  position: relative;
  cursor: default;
}
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--text-primary);
  color: #fff;
  font-size: var(--text-xs);
  font-weight: 500;
  padding: 4px 10px;
  border-radius: var(--r-sm);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--t-fast);
  z-index: 100;
}
[data-tooltip]:hover::after { opacity: 1; }

/* ── Scrollbar ──────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ── Search ─────────────────────────────────────────────── */
.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.search-icon {
  position: absolute;
  left: 10px;
  width: 14px; height: 14px;
  color: var(--text-muted);
  pointer-events: none;
}
.search-input {
  padding: 7px var(--sp-3) 7px 32px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: var(--text-sm);
  color: var(--text-primary);
  background: var(--bg-card);
  width: 240px;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
  width: 300px;
  transition: width var(--t-base), border-color var(--t-fast), box-shadow var(--t-fast);
}
.search-input::placeholder { color: var(--text-muted); }

/* ── Section headers ─────────────────────────────────────── */
.section-header {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  margin-bottom: var(--sp-5);
}
.section-title {
  font-size: var(--text-xl);
  font-weight: 700;
  color: var(--text-primary);
  flex: 1;
}
.section-desc {
  font-size: var(--text-sm);
  color: var(--text-muted);
  margin-top: 2px;
}

/* ── Login screen ───────────────────────────────────────── */
.login-screen {
  min-height: 100vh;
  display: flex;
  background: var(--bg-app);
}
.login-brand {
  width: 420px;
  flex-shrink: 0;
  background: linear-gradient(160deg, var(--bg-panel) 0%, #0d1f30 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--sp-8);
  border-right: 1px solid rgba(255,255,255,.08);
}
.login-content {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-8);
}
.login-box {
  width: 100%;
  max-width: 400px;
}
.login-title {
  font-size: var(--text-xl);
  font-weight: 700;
  color: #fff;
  margin-bottom: var(--sp-2);
}
.login-sub {
  font-size: var(--text-sm);
  color: rgba(255,255,255,.5);
  margin-bottom: var(--sp-8);
}
.btn-google {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-3);
  padding: 12px var(--sp-5);
  background: #fff;
  color: var(--text-primary);
  border-radius: var(--r-md);
  font-weight: 600;
  font-size: var(--text-sm);
  transition: box-shadow var(--t-fast);
  border: none;
  cursor: pointer;
}
.btn-google:hover { box-shadow: 0 0 0 3px rgba(0,168,232,.3); }
.btn-google svg { width: 20px; height: 20px; }
.login-divider {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin: var(--sp-5) 0;
  color: rgba(255,255,255,.2);
  font-size: var(--text-xs);
}
.login-divider::before,
.login-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,.1);
}
.login-notice {
  font-size: var(--text-xs);
  color: rgba(255,255,255,.35);
  text-align: center;
  margin-top: var(--sp-5);
  line-height: 1.6;
}

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width: 900px) {
  .app-shell {
    grid-template-columns: 1fr;
    grid-template-rows: var(--header-h) 1fr;
    grid-template-areas:
      "header"
      "main";
  }
  .sidebar { display: none; }
  .login-brand { display: none; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .form-row { grid-template-columns: 1fr; }
  .personal-grid { grid-template-columns: 1fr; }
}

/* ── Utilidades ─────────────────────────────────────────── */
.hidden    { display: none !important; }
.sr-only   { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
.truncate  { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flex      { display: flex; }
.flex-col  { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2    { gap: var(--sp-2); }
.gap-3    { gap: var(--sp-3); }
.gap-4    { gap: var(--sp-4); }
.mt-4     { margin-top: var(--sp-4); }
.mt-6     { margin-top: var(--sp-6); }
.mb-4     { margin-bottom: var(--sp-4); }
.mb-6     { margin-bottom: var(--sp-6); }
.w-full   { width: 100%; }
.text-muted  { color: var(--text-muted); }
.text-sm     { font-size: var(--text-sm); }
.text-xs     { font-size: var(--text-xs); }
.font-bold   { font-weight: 700; }
.font-mono   { font-family: var(--font-mono); }

// ── Planning / Distribución Semanal ──────────────────────
function renderPlanning() {
  const semana = PYL.semanas[App.semanaIdx];
  const tareas = PYL.columnaTareas;

  // Filtrar colaboradores
  let colabs = PYL.colaboradores.filter(c => {
    if (App.filtroGrupo  !== 'all' && c.grupo !== App.filtroGrupo) return false;
    if (App.filtroCiudad !== 'all' && c.ciudad !== App.filtroCiudad) return false;
    if (App.filtroDisp   !== 'all' && c.disponibilidad !== App.filtroDisp) return false;
    if (App.busqueda) {
      const q = App.busqueda.toLowerCase();
      return c.nombre.toLowerCase().includes(q) ||
             c.iniciales.toLowerCase().includes(q) ||
             c.clientes.join(' ').toLowerCase().includes(q);
    }
    return true;
  });

  // Construir headers de tareas
  const taskHeaders = tareas.map(t => `
    <th class="task-cell" data-tooltip="${t.label.replace('\n', ' ')}">${t.abbr}</th>
  `).join('');

  // Construir filas agrupadas
  const grupos = PYL.grupos;
  let rowsHtml = '';

  grupos.forEach(grupo => {
    const miembros = colabs.filter(c => c.grupo === grupo.id);
    if (miembros.length === 0) return;

    // Header de grupo
    rowsHtml += `
      <tr class="group-header">
        <td colspan="${7 + tareas.length}">
          <span class="group-dot" style="background:${grupo.dot}"></span>
          ${grupo.label}
          <span style="opacity:.5;margin-left:8px;font-weight:400;">(${miembros.length})</span>
        </td>
      </tr>`;

    // Filas de miembros
    miembros.forEach(c => {
      const tarea = App.tareas[c.id] || {};
      const rowCls = PYL.getRowClass(c.disponibilidad);
      const disp   = c.disponibilidad;
      const bDisp  = PYL.getDisponibilidadBadge(disp);

      // Backup badges
      const bk1 = c.backup1 ? `<span class="backup-badge">${c.backup1}</span>` : '';
      const bk2 = c.backup2 ? `<span class="backup-badge">${c.backup2}</span>` : '';

      // Clientes
      const cliHtml = c.clientes.length
        ? c.clientes.map(cl => `<span class="cliente-tag">• ${cl}</span>`).join('')
        : `<span class="cliente-tag" style="color:var(--text-muted);font-style:italic;">Sin asignación</span>`;

      // TS display
      const tsHtml = disp !== 'operativo' && disp !== 'lactancia'
        ? `<span class="badge ${bDisp.cls}" style="font-size:10px;">${bDisp.label.toUpperCase()}</span>`
        : c.ts
          ? `<span class="ts-value">${c.ts}</span>`
          : `<span class="ts-empty">— Sin TS asignada —</span>`;

      // Checkboxes de tareas
      const taskCells = tareas.map(t =>
        `<td class="task-cell">
          <div class="task-check ${tarea[t.key] ? 'checked' : ''}"
               onclick="toggleTarea('${c.id}','${t.key}',this)"
               role="checkbox" aria-checked="${!!tarea[t.key]}">
            ${ICONS.check}
          </div>
        </td>`
      ).join('');

      rowsHtml += `
        <tr class="${rowCls}" data-id="${c.id}">
          <td class="col-planificador">
            <div class="planner-cell">
              ${initBadge(c.iniciales, c.ciudad)}
              <div class="planner-info">
                <div class="planner-name">${c.nombre}</div>
                <div class="planner-cargo">${c.cargo}</div>
              </div>
            </div>
          </td>
          <td class="dispon-cell">${renderBadge(disp)}</td>
          <td class="ts-cell">${tsHtml}</td>
          <td class="backup-cell">
            <div class="backup-pair">${bk1}${bk2}</div>
          </td>
          <td class="clientes-cell">
            <div class="cliente-tags">${cliHtml}</div>
          </td>
          <td class="obs-cell">
            <span class="obs-text" title="${c.obs || ''}">${c.obs || ''}</span>
          </td>
          ${taskCells}
        </tr>`;
    });
  });

  return `
  <div class="dist-wrap">
    <div class="dist-toolbar">
      <div class="dist-toolbar-title">
        Distribución Semanal
        <span style="font-weight:400;color:var(--text-muted);margin-left:8px;">${semana.label}</span>
      </div>

      <div class="filter-group">
        <div class="search-wrap">
          <span class="search-icon">${ICONS.search}</span>
          <input type="text" class="search-input" placeholder="Buscar planificador..."
                 id="searchInput" value="${App.busqueda}"
                 oninput="App.busqueda=this.value;renderModule()">
        </div>
      </div>

      <div class="filter-group">
        <select class="filter-select" onchange="App.filtroGrupo=this.value;renderModule()">
          <option value="all">Todos los grupos</option>
          ${PYL.grupos.map(g => `
            <option value="${g.id}" ${App.filtroGrupo === g.id ? 'selected' : ''}>${g.label}</option>
          `).join('')}
        </select>

        <select class="filter-select" onchange="App.filtroCiudad=this.value;renderModule()">
          <option value="all">Todas las ciudades</option>
          <option value="UIO" ${App.filtroCiudad === 'UIO' ? 'selected' : ''}>UIO — Quito</option>
          <option value="GYE" ${App.filtroCiudad === 'GYE' ? 'selected' : ''}>GYE — Guayaquil</option>
          <option value="MIL" ${App.filtroCiudad === 'MIL' ? 'selected' : ''}>MIL — Milagro</option>
        </select>

        <select class="filter-select" onchange="App.filtroDisp=this.value;renderModule()">
          <option value="all">Toda disponibilidad</option>
          <option value="operativo"  ${App.filtroDisp === 'operativo'  ? 'selected' : ''}>Operativo</option>
          <option value="lactancia"  ${App.filtroDisp === 'lactancia'  ? 'selected' : ''}>Lactancia</option>
          <option value="maternidad" ${App.filtroDisp === 'maternidad' ? 'selected' : ''}>Maternidad</option>
          <option value="vacaciones" ${App.filtroDisp === 'vacaciones' ? 'selected' : ''}>Vacaciones</option>
        </select>
      </div>

      <button class="btn btn-primary btn-sm" onclick="openModalNuevoRegistro()">
        ${ICONS.plus} Nueva fila
      </button>
    </div>

    <div class="dist-scroll">
      <table class="dist-table">
        <thead>
          <tr>
            <th class="col-sticky" style="min-width:200px;">Planificador</th>
            <th style="min-width:100px;">Disponibilidad</th>
            <th style="min-width:180px;">Técnica Sucursal</th>
            <th style="min-width:90px;">Backups</th>
            <th style="min-width:200px;">Clientes / Proyectos</th>
            <th style="min-width:160px;">Observaciones</th>
            ${taskHeaders}
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  </div>

  <div style="padding:var(--sp-4) var(--sp-5);display:flex;align-items:center;gap:var(--sp-4);">
    <div style="display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;">
      ${PYL.grupos.map(g => `
        <span style="display:flex;align-items:center;gap:6px;font-size:var(--text-xs);color:var(--text-muted);">
          <span style="width:10px;height:10px;border-radius:50%;background:${g.dot};display:inline-block;"></span>
          ${g.label}
        </span>
      `).join('')}
    </div>
    <div style="margin-left:auto;display:flex;gap:var(--sp-3);flex-wrap:wrap;">
      ${['operativo','lactancia','maternidad','vacaciones'].map(d => {
        const b = PYL.getDisponibilidadBadge(d);
        return `<span class="badge ${b.cls}">${b.label}</span>`;
      }).join('')}
    </div>
  </div>`;
}

// ── Interacciones ─────────────────────────────────────────
function toggleTarea(colaboradorId, tareaKey, el) {
  if (!App.tareas[colaboradorId]) App.tareas[colaboradorId] = {};
  App.tareas[colaboradorId][tareaKey] = !App.tareas[colaboradorId][tareaKey];
  const checked = App.tareas[colaboradorId][tareaKey];
  el.classList.toggle('checked', checked);
  el.setAttribute('aria-checked', checked);
  showToast(`Tarea ${checked ? 'marcada' : 'desmarcada'}`, 'success');
}

function changeSemana(dir) {
  const newIdx = App.semanaIdx + dir;
  if (newIdx >= 0 && newIdx < PYL.semanas.length) {
    App.semanaIdx = newIdx;
    renderModule();
  }
}

function copyPlantilla(btn, encoded) {
  const text = decodeURIComponent(encoded);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copiado';
    setTimeout(() => { btn.textContent = 'Copiar'; }, 2000);
    showToast('Plantilla copiada al portapapeles', 'success');
  });
}

// ── Toast ─────────────────────────────────────────────────
function showToast(msg, type = 'default') {
  const container = document.getElementById('toastContainer');
  const icons = { success: ICONS.check, error: ICONS.alert, default: ICONS.activity };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${icons[type] || icons.default}</span>${msg}`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(24px)';
    toast.style.transition = 'all .2s ease';
    setTimeout(() => toast.remove(), 220);
  }, 2800);
}

// ── Router / Render principal ─────────────────────────────
function navigate(modulo) {
  App.modulo = modulo;
  // Reset filtros al cambiar módulo
  if (modulo !== 'planning') {
    App.busqueda = '';
  }
  render();
}

const moduleTitles = {
  dashboard: ['Dashboard', 'Panel General'],
  planning:  ['Distribución Semanal', 'PYL — Planificación y Logística'],
  personal:  ['Personal', 'Equipo PYL'],
  turnos:    ['Turnos', 'Fin de Semana — Rotación Anual'],
  clientes:  ['Clientes', 'Gestión de Clientes Nacionales'],
  ts:        ['Técnicas Sucursales', 'Coordinadores y Cobertura'],
  motivos:   ['Motivos y Plantillas', 'Textos Estándar Operativos'],
  acuerdos:  ['Acuerdos y Directrices', 'Operativo Vigente'],
};

function renderModule() {
  const main = document.getElementById('appMain');
  const header = document.getElementById('appHeader');

  const [title, sub] = moduleTitles[App.modulo] || ['PYL', ''];
  header.outerHTML = renderHeader(title, sub);
  // Re-bind header
  document.getElementById('appHeader');

  const renders = {
    dashboard: renderDashboard,
    planning:  renderPlanning,
    personal:  renderPersonal,
    turnos:    renderTurnos,
    clientes:  renderClientes,
    ts:        renderTS,
    motivos:   renderMotivos,
    acuerdos:  renderAcuerdos,
  };
  main.innerHTML = (renders[App.modulo] || renderDashboard)();
}

function render() {
  const shell = document.getElementById('appShell');
  const [title, sub] = moduleTitles[App.modulo] || ['PYL', ''];

  shell.innerHTML = `
    ${renderSidebar()}
    <div id="appHeader">${renderHeader(title, sub)}</div>
    <main class="app-main" id="appMain"></main>
  `;

  renderModule();

  // Rebind nav (sidebar se regenera)
  $$('.nav-item').forEach(el => {
    el.addEventListener('click', function() {
      const mod = this.getAttribute('onclick')?.match(/navigate\('(\w+)'\)/)?.[1];
      if (mod) {
        $$('.nav-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
      }
    });
  });
}
